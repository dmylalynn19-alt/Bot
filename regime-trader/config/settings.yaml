# ==============================================================================
# regime-trader configuration
#
# All configurable parameters for the regime-detection trading system.
# Values here are defaults for paper trading / development. Review every
# section before running against a live account.
# ==============================================================================

# ------------------------------------------------------------------------------
# Broker connectivity and universe
# ------------------------------------------------------------------------------
broker:
  paper_trading: true          # true = use Alpaca paper endpoint, false = live trading
  symbols:                     # Universe of tickers the strategy trades
    - SPY
    - QQQ
    - AAPL
    - MSFT
    - AMZN
    - GOOGL
    - NVDA
    - META
    - TSLA
    - AMD
  timeframe: 1Day               # Bar timeframe for data fetching (e.g. 1Day, 1Hour, 15Min)

# ------------------------------------------------------------------------------
# Hidden Markov Model regime detection
# ------------------------------------------------------------------------------
hmm:
  n_candidates: [3, 4, 5, 6, 7]  # Candidate hidden-state counts to evaluate for model selection
  n_init: 10                     # Number of random initializations per candidate model
  covariance_type: full          # HMM emission covariance type (full, diag, tied, spherical)
  min_train_bars: 252            # Minimum bars of history required before fitting (~1 trading year)
  stability_bars: 3              # Consecutive bars a regime must persist before being confirmed
  flicker_window: 20             # Rolling window (bars) used to detect regime "flicker"
  flicker_threshold: 4           # Max allowed regime changes within flicker_window before flagging instability
  min_confidence: 0.55           # Minimum posterior probability required to act on a regime call

# ------------------------------------------------------------------------------
# Regime-based allocation strategy
# ------------------------------------------------------------------------------
strategy:
  low_vol_allocation: 0.95            # Target portfolio allocation in a low-volatility regime
  mid_vol_allocation_trend: 0.95      # Target allocation in mid-volatility regime, trend confirmed
  mid_vol_allocation_no_trend: 0.60   # Target allocation in mid-volatility regime, no confirmed trend
  high_vol_allocation: 0.60           # Target allocation in a high-volatility regime
  low_vol_leverage: 1.25              # Leverage multiplier applied only in low-volatility regime
  rebalance_threshold: 0.10           # Fractional drift from target allocation that triggers a rebalance
  uncertainty_size_mult: 0.50         # Position size multiplier applied when regime confidence is low

# ------------------------------------------------------------------------------
# Technical indicator confluence (core.indicator_signals) - drives the
# options strategy's entry/exit direction. Same indicators TradingView charts
# are built around, computed directly from the bars this bot already pulls.
# ------------------------------------------------------------------------------
indicators:
  rsi_period: 14                  # RSI lookback
  rsi_oversold: 30.0              # RSI below this is a bullish (bounce) vote
  rsi_overbought: 70.0            # RSI above this is a bearish vote
  macd_fast: 12                   # MACD fast EMA period
  macd_slow: 26                   # MACD slow EMA period
  macd_signal: 9                  # MACD signal line EMA period
  sma_fast: 20                    # Fast SMA period for the crossover vote
  sma_slow: 50                    # Slow SMA period for the crossover vote
  bb_period: 20                   # Bollinger Band period
  bb_std: 2.0                     # Bollinger Band width, in standard deviations
  min_confluence: 3               # Indicators (out of 4) that must agree to fire a signal
  min_bars: 60                    # Minimum history required before computing indicators

# ------------------------------------------------------------------------------
# Options strategy (core.options_strategy) - directional calls/puts only,
# sized by defined premium risk. Requires options trading enabled/approved
# on your Alpaca account.
# ------------------------------------------------------------------------------
options_strategy:
  target_delta: 0.35              # Preferred absolute delta of the selected contract
  min_days_to_expiration: 21      # Don't buy contracts expiring sooner than this (theta decay)
  max_days_to_expiration: 45      # Don't buy contracts expiring later than this (diluted leverage)
  max_risk_per_trade: 0.02        # Max fraction of equity risked (premium paid) on a single trade
  stop_loss_pct: 0.50             # Exit if premium drops this fraction from entry
  take_profit_pct: 1.00           # Exit if premium rises this fraction from entry
  min_confidence: 0.75            # Minimum indicator confluence confidence required to act

# ------------------------------------------------------------------------------
# Support/resistance strategy (core.support_resistance + core.sr_strategy) -
# the primary strategy: detects support/resistance zones from swing pivots
# and only trades a bounce/rejection off one when volume, VWAP, RSI, and
# MACD all confirm it (min_required_confirmations below). Works on whatever
# bar timeframe you feed it - set broker.timeframe to intraday bars (e.g.
# 5Min) for day trading or 1Day for swing trading; the strategy adapts its
# VWAP calculation automatically (see core/sr_strategy.py).
# ------------------------------------------------------------------------------
sr_strategy:
  pivot_window: 5                 # Bars on each side a swing high/low must beat to count as a pivot
  cluster_tolerance_pct: 0.005    # Pivots within this fractional distance are merged into one zone
  min_touches: 2                  # Minimum pivots required to keep a support/resistance zone
  level_proximity_pct: 0.005      # How close price must be to a level to even consider a setup
  volume_window: 20               # Trailing bars used for the volume baseline
  volume_multiple: 1.2            # Entry bar's volume must be at least this multiple of the baseline
  vwap_window: 10                 # Rolling VWAP window (bars) - daily-or-slower timeframes only;
                                   # intraday timeframes use the standard calendar-day session VWAP
  rsi_period: 14                  # RSI lookback
  rsi_oversold: 30.0              # RSI at/below this, near support, confirms a long
  rsi_overbought: 70.0            # RSI at/above this, near resistance, confirms a short
  macd_fast: 12                   # MACD fast EMA period
  macd_slow: 26                   # MACD slow EMA period
  macd_signal: 9                  # MACD signal line EMA period
  min_required_confirmations: 4   # How many of {volume, vwap, rsi, macd} must pass (out of 4)
  risk_reward_ratio: 2.0          # Target distance from entry, as a multiple of the stop distance
  min_bars: 60                    # Minimum bars of history required before evaluating a setup

# ------------------------------------------------------------------------------
# Risk management
# ------------------------------------------------------------------------------
risk:
  max_risk_per_trade: 0.01     # Max fraction of equity risked on a single trade
  max_exposure: 0.80           # Max total portfolio exposure as a fraction of equity
  max_leverage: 1.25           # Hard cap on account leverage
  max_single_position: 0.15    # Max fraction of equity in any single position
  max_concurrent: 5            # Max number of concurrently open positions
  max_daily_trades: 20         # Max number of trades allowed per day
  daily_dd_reduce: 0.02        # Daily drawdown level that triggers exposure reduction
  daily_dd_halt: 0.03          # Daily drawdown level that triggers a full trading halt
  weekly_dd_reduce: 0.05       # Weekly drawdown level that triggers exposure reduction
  weekly_dd_halt: 0.07         # Weekly drawdown level that triggers a full trading halt
  max_dd_from_peak: 0.10       # Max drawdown from equity peak before halting trading
  max_correlated_exposure: 0.30   # Max fraction of equity concentrated in one sector
  min_confidence: 0.55             # Regime confidence below this forces leverage to 1.0x (risk manager's own copy of this threshold, kept independent of hmm.min_confidence)
  min_position_dollars: 100        # Reject a sized position smaller than this
  max_spread_pct: 0.005            # Reject an order when the bid-ask spread is at least this wide
  duplicate_window_seconds: 60     # Block a duplicate same-symbol/same-direction order within this many seconds
  correlation_reduce_threshold: 0.70   # 60-day rolling correlation with an existing position above this halves size
  correlation_reject_threshold: 0.85   # ...above this rejects the trade outright
  overnight_gap_multiple: 3.0      # Overnight position sizing assumes a gap-through this many multiples of the per-share stop distance
  overnight_max_loss_pct: 0.02     # ...sized so that a gap-through loses at most this fraction of equity
  leverage_force_position_count: 3 # This many or more open positions forces leverage back to 1.0x
  trading_halt_lock_file: "trading_halted.lock"   # Written on a peak-drawdown halt; delete manually to resume trading

# ------------------------------------------------------------------------------
# Backtesting
# ------------------------------------------------------------------------------
backtest:
  step_size: 126                # Walk-forward step size in bars (~6 trading months)
  risk_free_rate: 0.045         # Annualized risk-free rate used for Sharpe/Sortino calculations

# ------------------------------------------------------------------------------
# Monitoring
# ------------------------------------------------------------------------------
monitoring:
  dashboard_refresh_seconds: 5   # How often the live dashboard refreshes
  alert_rate_limit_minutes: 15   # Minimum minutes between repeat alerts of the same type
